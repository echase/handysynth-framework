<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[VARIANT NAME] — HandySynth</title>
<style>
  /* === VARIANT STYLES === */
  /* Replace everything below with your theme */

  * { margin:0; padding:0; box-sizing:border-box }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  #container { position: relative; width: 100vw; height: 100vh; }

  #videoEl {
    position: absolute; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1);
    opacity: 0; /* 0 = invisible, 0.15 = ghost, 1 = full camera */
    pointer-events: none;
  }

  #canvas { position: absolute; width: 100%; height: 100%; }

  #status {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px; opacity: 0.3;
    letter-spacing: 0.1em; text-transform: uppercase;
    z-index: 10;
  }

  /* Start overlay — required for AudioContext + camera */
  #start-overlay {
    position: absolute; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10,10,10,0.95);
    cursor: pointer;
    transition: opacity 0.5s;
  }
  #start-overlay.hidden { opacity: 0; pointer-events: none; }
  #start-overlay h1 { font-size: 24px; letter-spacing: 0.3em; opacity: 0.7; margin-bottom: 10px; }
  #start-overlay p { font-size: 12px; opacity: 0.3; }
</style>
</head>
<body>
<div id="container">
  <video id="videoEl" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="start-overlay">
    <h1>[VARIANT NAME]</h1>
    <p>Click to start</p>
  </div>

  <!-- Add your controls here -->

  <div id="status">Initializing…</div>
</div>

<script type="module">
import { HandySynth } from '../../handysynth.js';
import { createVariant } from './variant.js';

const variant = createVariant();

const hs = new HandySynth({
  variant,
  options: {
    // Tune these per variant:
    defaultScale:     'pentatonic',  // see SCALES in handysynth.js
    rootFreq:         261.63,        // C4 — adjust octave to taste
    reversePitch:     true,          // right = high, left = low
    leftOctaveShift:  0,
    rightOctaveShift: 1,
    masterVolume:     0.7,
    pinchOn:          0.062,         // tighter = harder to trigger
    pinchOff:         0.092,         // wider gap = less jitter
  },
});

hs.mount(document.getElementById('container'), {
  videoEl:   document.getElementById('videoEl'),
  canvasEl:  document.getElementById('canvas'),
  statusEl:  document.getElementById('status'),
  overlayEl: document.getElementById('start-overlay'),
});

// Wire up your controls to hs.setScale(), hs.setRoot(), hs.setVolume()
</script>
</body>
</html>
